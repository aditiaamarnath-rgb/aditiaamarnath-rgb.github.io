      "soft-warm": { display: "'Fraunces', Georgia, serif", dw: 600, hand: "'Gochi Hand', cursive", hs: 0.82, label: "'DM Mono', monospace", body: "'Source Serif 4', Georgia, serif", sticker: "'DM Sans', sans-serif" },
      "scrapbook": { display: "'DM Serif Display', Georgia, serif", dw: 400, hand: "'Nanum Pen Script', cursive", hs: 1.15, label: "'Special Elite', monospace", body: "'Lora', Georgia, serif", sticker: "'Rubik', sans-serif" },
      "clean-modern": { display: "'Instrument Serif', Georgia, serif", dw: 400, hand: "'Patrick Hand', cursive", hs: 0.86, label: "'IBM Plex Mono', monospace", body: "'Hanken Grotesk', sans-serif", sticker: "'Space Grotesk', sans-serif" },
      "playful": { display: "'Young Serif', Georgia, serif", dw: 400, hand: "'Covered By Your Grace', cursive", hs: 0.95, label: "'Azeret Mono', monospace", body: "'Literata', Georgia, serif", sticker: "'Fredoka', sans-serif" },
      "original": { display: "'Cormorant Garamond', Georgia, serif", dw: 600, hand: "'Caveat', cursive", hs: 1, label: "'Courier Prime', monospace", body: "'Newsreader', Georgia, serif", sticker: "'Inter', sans-serif" }
    };
    const fonts = FONTS[this.props.fontSet] || FONTS["reference"];
    return {
      fonts: fonts,
      cards: cards,
      hint: s.mode === "open" ? "press esc or close to tuck it back in" : "hover to fan the folders out — click one to open it",
      closeFolder: () => this.close(),
      stageLeave: () => { if (this.state.mode === "fan") this.setState({ mode: "stack", hovered: 0 }); },
      stageBlur: (e) => {
        if (this.state.mode === "fan" && !e.currentTarget.contains(e.relatedTarget)) this.setState({ mode: "stack", hovered: 0 });
      }
    };
  }
}
</script>
